name: Build TDLib for Android

# One-shot build of TDLib for Android. Produces tdlib.zip containing
# per-ABI .so files and Java sources. Download the artifact and vendor
# it under app/src/main/jniLibs and app/src/main/java/org/drinkless/tdlib.
#
# Only needs to be re-run when upgrading TDLib.

on:
  workflow_dispatch:
    inputs:
      td_ref:
        description: "TDLib git ref (commit SHA or branch). Default pins to a known-good master."
        default: "8921c22f0f85"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zlib1g-dev gperf php-cli perl

      - name: Check JDK / CMake
        run: |
          java -version
          cmake --version
          php --version
          perl --version
          gperf --version

      - name: Clone TDLib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout ${{ inputs.td_ref }}
          git rev-parse HEAD

      - name: Patch build scripts to only target arm64-v8a + x86_64
        working-directory: td/example/android
        run: |
          # The vanilla scripts iterate 4 ABIs. We only ship 2 (arm64-v8a for
          # phones, x86_64 for Intel emulators). Cuts build time ~50%.
          sed -i 's|for ABI in arm64-v8a armeabi-v7a x86_64 x86|for ABI in arm64-v8a x86_64|g' \
            build-openssl.sh build-tdlib.sh
          echo "--- build-openssl.sh ABI line ---"
          grep "^for ABI" build-openssl.sh
          echo "--- build-tdlib.sh ABI line ---"
          grep "^for ABI" build-tdlib.sh

      - name: Fetch Android SDK
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: Build OpenSSL (arm64-v8a + x86_64)
        working-directory: td/example/android
        run: bash -x ./build-openssl.sh

      - name: Build TDLib (arm64-v8a + x86_64)
        working-directory: td/example/android
        run: bash -x ./build-tdlib.sh

      - name: Inspect output
        working-directory: td/example/android
        run: |
          ls -lah tdlib/ || true
          ls -lah tdlib/libs/ || true
          ls -lah tdlib/java/ || true

      - name: Upload tdlib.zip
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: td/example/android/tdlib/tdlib.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload raw tdlib directory (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-raw
          path: td/example/android/tdlib/
          retention-days: 30
          if-no-files-found: warn
