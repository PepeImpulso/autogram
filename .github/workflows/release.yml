name: Release APK

# Builds a signed release APK and publishes it to a GitHub release.
#
# Triggers:
#   - Tag push matching v*      → creates a GitHub release, uploads APK
#   - workflow_dispatch         → builds APK, uploads as artifact only (test runs)
#
# TDLib native libs are vendored under app/src/main/jniLibs and tracked in git,
# so this workflow only runs assembleGithubRelease; it does not rebuild TDLib.
# Use the build-tdlib.yml workflow when upgrading TDLib.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for an existing public release
        # `scripts/publish_autogram_release.sh --manual` publishes the release
        # to autogram-releases itself and then pushes this tag. Skip the
        # (billable) build in that case instead of failing at the end with
        # "a release with the same tag name already exists".
        id: precheck
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_PAT || github.token }}
        run: |
          # Skip only when the release is published AND carries its APK asset.
          # A missing release, a draft, a half-published release (no APK) or an
          # API error all fall through to the normal build.
          APK_NAME="autogram-${GITHUB_REF_NAME#v}.apk"
          if gh release view "${GITHUB_REF_NAME}" --repo PepeImpulso/autogram-releases               --json isDraft,assets --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null               | grep -qx "$APK_NAME"; then
            echo "::notice::Release ${GITHUB_REF_NAME} (with $APK_NAME) already exists in autogram-releases; skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.precheck.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        if: steps.precheck.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Write keystore.properties
        if: steps.precheck.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write local.properties
        if: steps.precheck.outputs.skip != 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cat > local.properties <<EOF
          telegram.apiId=$TELEGRAM_API_ID
          telegram.apiHash=$TELEGRAM_API_HASH
          sentry.dsn=$SENTRY_DSN
          EOF

      - name: Gradle assembleGithubRelease
        if: steps.precheck.outputs.skip != 'true'
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: Locate APK
        if: steps.precheck.outputs.skip != 'true'
        id: apk
        run: |
          APK_SRC="app/build/outputs/apk/github/release/app-github-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK not found at $APK_SRC"
            ls -R app/build/outputs/apk/ || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          APK_OUT="autogram-${VERSION}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "apk_path=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.precheck.outputs.skip != 'true'
        # Best-effort only: tag releases are published in the next step.
        # Do not block public release creation if Actions artifact quota is full.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: autogram-apk-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          # APKs are published to PepeImpulso/autogram-releases on tag builds;
          # keep CI artifacts briefly to avoid exhausting GitHub Actions storage.
          retention-days: 7
          if-no-files-found: error

      # Releases are published to the PUBLIC PepeImpulso/autogram-releases repo
      # (this source repo is private, so its /releases endpoint would 404 for
      # the unauthenticated updater baked into the APK). Requires a PAT with
      # `contents: write` on autogram-releases, stored as secret
      # RELEASES_REPO_PAT.
      - name: Create GitHub release (cross-repo to autogram-releases)
        if: startsWith(github.ref, 'refs/tags/v') && steps.precheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASES_REPO_PAT secret is not set — cannot publish to public releases repo."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          # The release can appear while this job is building (manual publish
          # racing the tag push); treat that as success, never overwrite it.
          if gh release view "$TAG" --repo PepeImpulso/autogram-releases               --json isDraft,assets --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null               | grep -qx "autogram-${TAG#v}.apk"; then
            echo "::notice::Release $TAG (with APK) already exists in autogram-releases; not recreating."
            exit 0
          fi
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          NOTES_ARGS=(--generate-notes)
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          fi
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --repo PepeImpulso/autogram-releases \
            --title "$TAG" \
            "${NOTES_ARGS[@]}" \
            $PRERELEASE_FLAG
